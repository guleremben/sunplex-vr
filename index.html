<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>SUNPLEX Chrome | Chery Tiggo 8 — 3B Sanal Sergi</title>
  <style>
    :root {
      --navy-1: #0d1626;
      --navy-2: #16233f;
      --navy-3: #1e3055;
      --chrome-1: #f4f6f9;
      --chrome-2: #c9d0da;
      --chrome-3: #8e99a8;
      --line: rgba(201, 208, 218, 0.18);
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: var(--navy-1); }
    body {
      font-family: "Avenir Next", "Segoe UI", "Helvetica Neue", Arial, sans-serif;
      color: var(--chrome-1);
      -webkit-font-smoothing: antialiased;
    }
    #app { position: fixed; inset: 0; }
    #app canvas { display: block; }

    /* ---------- Yukleme ekrani ---------- */
    #loader {
      position: fixed; inset: 0; z-index: 50;
      background: radial-gradient(120% 120% at 50% 20%, var(--navy-3) 0%, var(--navy-1) 70%);
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 22px; transition: opacity 0.6s ease;
    }
    #loader.hidden { opacity: 0; pointer-events: none; }
    .wordmark { text-align: center; user-select: none; }
    .wordmark .sun { font-size: 42px; font-weight: 800; letter-spacing: 2px; color: var(--navy-2);
      text-shadow: 0 1px 0 rgba(255,255,255,0.25); }
    #loader .wordmark .sun { color: var(--chrome-1); }
    .wordmark .plex {
      font-size: 42px; font-weight: 800; letter-spacing: 2px;
      background: linear-gradient(180deg, #ffffff 0%, #9aa5b4 45%, #e8ecf1 55%, #6f7a89 100%);
      -webkit-background-clip: text; background-clip: text; color: transparent;
    }
    .wordmark .sub {
      margin-top: 4px; font-size: 12px; font-weight: 600; letter-spacing: 8px;
      color: var(--chrome-3); text-transform: uppercase;
    }
    #loader-bar { width: 240px; height: 2px; background: rgba(255,255,255,0.12); border-radius: 2px; overflow: hidden; }
    #loader-fill { width: 0%; height: 100%; background: linear-gradient(90deg, var(--chrome-2), #ffffff); transition: width 0.3s ease; }
    #loader-status { font-size: 12px; letter-spacing: 3px; color: var(--chrome-3); text-transform: uppercase; }

    /* ---------- Ust bar ---------- */
    #topbar {
      position: fixed; top: 0; left: 0; right: 0; z-index: 20;
      display: flex; align-items: center; justify-content: space-between;
      padding: 18px 26px;
      background: linear-gradient(180deg, rgba(13,22,38,0.85) 0%, rgba(13,22,38,0) 100%);
      pointer-events: none;
    }
    #topbar .wordmark { display: flex; align-items: baseline; gap: 2px; }
    #topbar .wordmark .sun, #topbar .wordmark .plex { font-size: 22px; }
    #topbar .wordmark .sun { color: var(--chrome-1); }
    #topbar .model-tag { font-size: 12px; letter-spacing: 3px; color: var(--chrome-2); text-transform: uppercase; text-align: right; line-height: 1.7; }
    #topbar .model-tag strong { display: block; font-size: 14px; letter-spacing: 2px; color: #fff; }

    /* ---------- Alt kontrol cubugu ---------- */
    #dock {
      position: fixed; left: 50%; bottom: 22px; transform: translateX(-50%);
      z-index: 20; display: flex; align-items: center; gap: 10px;
      padding: 10px 12px; border-radius: 14px;
      background: rgba(13, 22, 38, 0.72);
      border: 1px solid var(--line);
      backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
    }
    .dock-btn {
      appearance: none; border: 1px solid transparent; cursor: pointer;
      padding: 10px 16px; border-radius: 10px;
      background: transparent; color: var(--chrome-2);
      font-size: 13px; font-weight: 600; letter-spacing: 0.6px;
      display: flex; align-items: center; gap: 8px;
      transition: all 0.2s ease; white-space: nowrap;
    }
    .dock-btn svg { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 1.6; }
    .dock-btn:hover { color: #fff; background: rgba(255,255,255,0.06); }
    .dock-btn.active {
      color: var(--navy-1);
      background: linear-gradient(180deg, #ffffff 0%, var(--chrome-2) 100%);
      border-color: rgba(255,255,255,0.5);
    }
    .dock-sep { width: 1px; height: 26px; background: var(--line); }

    /* ---------- Arac fotograf gorunumu: CERCEVESIZ tam ekran ---------- */
    #car-viewer {
      position: fixed; inset: 0; z-index: 8;
      display: none;
      background: #b9bec6;
    }
    #car-viewer.visible { display: block; }
    #car-stage {
      position: absolute; inset: 0;
      cursor: grab; touch-action: none; user-select: none;
      overflow: hidden;
    }
    #car-stage.grabbing { cursor: grabbing; }
    #car-stage img {
      position: absolute; inset: 0; width: 100%; height: 100%;
      object-fit: cover; pointer-events: none;
      will-change: opacity;
    }
    /* acik fotograf ustunde ust bar/ipucu koyu renge doner */
    #car-viewer.visible ~ #topbar {
      background: linear-gradient(180deg, rgba(235, 238, 242, 0.88) 0%, rgba(235, 238, 242, 0) 100%);
    }
    #car-viewer.visible ~ #topbar .wordmark .sun { color: var(--navy-1); }
    #car-viewer.visible ~ #topbar .model-tag { color: rgba(13, 22, 38, 0.6); }
    #car-viewer.visible ~ #topbar .model-tag strong { color: var(--navy-1); }
    #car-viewer.visible ~ #hint { color: rgba(13, 22, 38, 0.6); }

    #car-angle-ui {
      position: absolute; left: 50%; bottom: 118px; transform: translateX(-50%);
      display: flex; flex-direction: column; align-items: center; gap: 10px;
      pointer-events: none;
    }
    #car-angle-label {
      font-size: 12px; letter-spacing: 4px; text-transform: uppercase;
      color: rgba(13, 22, 38, 0.72); font-weight: 700;
      text-shadow: 0 1px 6px rgba(255, 255, 255, 0.5);
    }
    #car-dots { display: flex; gap: 10px; pointer-events: auto; }
    .car-dot {
      appearance: none; border: 1px solid rgba(13, 22, 38, 0.45); cursor: pointer;
      width: 10px; height: 10px; border-radius: 50%;
      background: transparent; padding: 0;
      transition: all 0.25s ease;
    }
    .car-dot:hover { border-color: var(--navy-1); }
    .car-dot.active {
      background: var(--navy-1);
      border-color: var(--navy-1); transform: scale(1.25);
    }

    /* ---------- Ipucu ---------- */
    #hint {
      position: fixed; left: 50%; bottom: 92px; transform: translateX(-50%);
      z-index: 15; font-size: 12px; letter-spacing: 2px; text-transform: uppercase;
      color: var(--chrome-3); pointer-events: none; transition: opacity 0.8s ease;
    }
    #hint.hidden { opacity: 0; }

    /* ---------- Bilgi paneli ---------- */
    #info-panel {
      position: fixed; right: 26px; top: 50%; transform: translateY(-50%) translateX(16px);
      z-index: 20; width: 300px; padding: 22px;
      border-radius: 16px; background: rgba(13, 22, 38, 0.82);
      border: 1px solid var(--line);
      backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
      opacity: 0; pointer-events: none; transition: all 0.35s ease;
    }
    #info-panel.open { opacity: 1; pointer-events: auto; transform: translateY(-50%) translateX(0); }
    #info-panel h3 { font-size: 15px; letter-spacing: 1px; margin-bottom: 10px; color: #fff; }
    #info-panel p { font-size: 13px; line-height: 1.65; color: var(--chrome-2); }
    #info-panel .patent {
      margin-top: 14px; padding-top: 12px; border-top: 1px solid var(--line);
      font-size: 11px; letter-spacing: 1.5px; color: var(--chrome-3); text-transform: uppercase;
    }
    #info-close {
      position: absolute; top: 10px; right: 12px; background: none; border: none;
      color: var(--chrome-3); font-size: 18px; cursor: pointer; line-height: 1;
    }
    #info-close:hover { color: #fff; }

    /* ---------- VR butonu (three VRButton stilini eziyoruz) ---------- */
    #VRButton {
      background: linear-gradient(180deg, #ffffff 0%, #c9d0da 100%) !important;
      color: #0d1626 !important;
      border: 1px solid rgba(255,255,255,0.5) !important;
      border-radius: 10px !important;
      font-weight: 700 !important;
      letter-spacing: 1px !important;
      opacity: 1 !important;
      left: auto !important; right: 26px !important; bottom: 26px !important;
      width: auto !important; padding: 12px 18px !important;
      font-family: inherit !important;
    }

    @media (max-width: 1180px) {
      /* dar ekranlarda VR butonu dock ile cakismasin */
      #VRButton { right: 12px !important; bottom: 92px !important; }
    }
    @media (max-width: 720px) {
      #topbar { padding: 14px 16px; }
      #topbar .model-tag { display: none; }
      #dock { bottom: 14px; gap: 4px; padding: 8px; max-width: calc(100vw - 20px); overflow-x: auto; }
      .dock-btn { padding: 9px 12px; font-size: 12px; }
      #info-panel { right: 12px; left: 12px; width: auto; top: auto; bottom: 150px; transform: none; }
      #info-panel.open { transform: none; }
    }
  </style>
  <script type="module" crossorigin src="./assets/main-BoDKxFm-.js"></script>
  <link rel="modulepreload" crossorigin href="./assets/VRButton-DGxbujZb.js">
</head>
<body>
  <div id="app"></div>

  <div id="car-viewer">
    <div id="car-stage"></div>
    <div id="car-angle-ui">
      <span id="car-angle-label">Ön Çeyrek</span>
      <div id="car-dots"></div>
    </div>
  </div>

  <div id="loader">
    <div class="wordmark">
      <span class="sun">SUN</span><span class="plex">PLEX</span>
      <div class="sub">Chrome</div>
    </div>
    <div id="loader-bar"><div id="loader-fill"></div></div>
    <div id="loader-status">Sahne hazırlanıyor</div>
  </div>

  <header id="topbar">
    <div class="wordmark">
      <span class="sun">SUN</span><span class="plex">PLEX</span>
    </div>
    <div class="model-tag">
      <strong>Chery Tiggo 8 2023</strong>
      Metal Kromlu Cam Rüzgarlığı
    </div>
  </header>

  <div id="hint">Sürükleyerek döndürün &middot; Tekerlekle yakınlaşın</div>

  <nav id="dock">
    <button class="dock-btn" id="btn-vr-preview" type="button">
      <svg viewBox="0 0 24 24"><path d="M2.5 9A2.5 2.5 0 0 1 5 6.5h14A2.5 2.5 0 0 1 21.5 9v4.5A2.5 2.5 0 0 1 19 16h-3.6l-1.9-2.6a1.9 1.9 0 0 0-3 0L8.6 16H5a2.5 2.5 0 0 1-2.5-2.5z"/></svg>
      VR Önizleme
    </button>
  </nav>

  <aside id="info-panel">
    <button id="info-close" type="button">&times;</button>
    <h3 id="info-title">SUNPLEX Chrome</h3>
    <p id="info-body"></p>
    <div class="patent">Patentli Ürün &middot; No: 2025/000629</div>
  </aside>

</body>
</html>
