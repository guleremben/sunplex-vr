<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>SUNPLEX | Fiat Egea — VR Stüdyo</title>
  <style>
    :root {
      --navy-1: #0a1224;
      --navy-2: #13203a;
      --navy-3: #1c2f56;
      --chrome-1: #f4f6f9;
      --chrome-2: #c9d0da;
      --chrome-3: #8e99a8;
      --line: rgba(201, 208, 218, 0.18);
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: var(--navy-1); }
    body {
      font-family: "Avenir Next", "Segoe UI", "Helvetica Neue", Arial, sans-serif;
      color: var(--chrome-1);
      -webkit-font-smoothing: antialiased;
    }
    #app { position: fixed; inset: 0; }
    #app canvas { display: block; }

    #loader {
      position: fixed; inset: 0; z-index: 50;
      background: radial-gradient(120% 120% at 50% 20%, var(--navy-3) 0%, var(--navy-1) 70%);
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 22px; transition: opacity 0.6s ease;
    }
    #loader.hidden { opacity: 0; pointer-events: none; }
    .wordmark { text-align: center; user-select: none; }
    .wordmark .sun { font-size: 42px; font-weight: 800; letter-spacing: 2px; color: var(--chrome-1); }
    .wordmark .plex {
      font-size: 42px; font-weight: 800; letter-spacing: 2px;
      background: linear-gradient(180deg, #ffffff 0%, #9aa5b4 45%, #e8ecf1 55%, #6f7a89 100%);
      -webkit-background-clip: text; background-clip: text; color: transparent;
    }
    .wordmark .sub { margin-top: 4px; font-size: 12px; font-weight: 600; letter-spacing: 8px; color: var(--chrome-3); text-transform: uppercase; }
    #loader-bar { width: 240px; height: 2px; background: rgba(255,255,255,0.12); border-radius: 2px; overflow: hidden; }
    #loader-fill { width: 0%; height: 100%; background: linear-gradient(90deg, var(--chrome-2), #ffffff); transition: width 0.3s ease; }
    #loader-status { font-size: 12px; letter-spacing: 3px; color: var(--chrome-3); text-transform: uppercase; }

    #topbar {
      position: fixed; top: 0; left: 0; right: 0; z-index: 20;
      display: flex; align-items: center; justify-content: space-between;
      padding: 18px 26px;
      background: linear-gradient(180deg, rgba(10,18,36,0.85) 0%, rgba(10,18,36,0) 100%);
      pointer-events: none;
    }
    #topbar .wordmark { display: flex; align-items: baseline; gap: 2px; }
    #topbar .wordmark .sun, #topbar .wordmark .plex { font-size: 22px; }
    #topbar .model-tag { font-size: 12px; letter-spacing: 3px; color: var(--chrome-2); text-transform: uppercase; text-align: right; line-height: 1.7; }
    #topbar .model-tag strong { display: block; font-size: 14px; letter-spacing: 2px; color: #fff; }

    #dock {
      position: fixed; left: 50%; bottom: 22px; transform: translateX(-50%);
      z-index: 20; display: flex; align-items: center; gap: 6px;
      padding: 10px 12px; border-radius: 14px;
      background: rgba(10, 18, 36, 0.72);
      border: 1px solid var(--line);
      backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
      max-width: calc(100vw - 24px); overflow-x: auto;
    }
    .dock-btn {
      appearance: none; border: 1px solid transparent; cursor: pointer;
      padding: 10px 14px; border-radius: 10px;
      background: transparent; color: var(--chrome-2);
      font-size: 12px; font-weight: 600; letter-spacing: 0.6px;
      display: flex; align-items: center; gap: 8px;
      transition: all 0.2s ease; white-space: nowrap;
    }
    .dock-btn svg { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 1.6; }
    .dock-btn:hover { color: #fff; background: rgba(255,255,255,0.06); }
    .dock-btn.active {
      color: var(--navy-1);
      background: linear-gradient(180deg, #ffffff 0%, var(--chrome-2) 100%);
      border-color: rgba(255,255,255,0.5);
    }
    .dock-sep { width: 1px; height: 26px; background: var(--line); flex: none; }

    #hint {
      position: fixed; left: 50%; bottom: 34px; transform: translateX(-50%);
      z-index: 15; font-size: 12px; letter-spacing: 2px; text-transform: uppercase;
      color: var(--chrome-3); pointer-events: none; transition: opacity 0.8s ease;
      text-align: center; white-space: nowrap;
    }
    #hint.hidden { opacity: 0; }

    #station-label {
      position: fixed; left: 50%; top: 84px; transform: translateX(-50%);
      z-index: 15; font-size: 12px; letter-spacing: 5px; text-transform: uppercase;
      color: var(--chrome-2); font-weight: 700; pointer-events: none;
    }

    #VRButton {
      background: linear-gradient(180deg, #ffffff 0%, #c9d0da 100%) !important;
      color: #0a1224 !important;
      border: 1px solid rgba(255,255,255,0.5) !important;
      border-radius: 10px !important;
      font-weight: 700 !important;
      letter-spacing: 1px !important;
      opacity: 1 !important;
      left: auto !important; right: 26px !important; top: 64px !important; bottom: auto !important;
      width: auto !important; padding: 12px 18px !important;
      font-family: inherit !important;
    }
    @media (max-width: 720px) {
      #topbar { padding: 14px 16px; }
      #topbar .model-tag { display: none; }
      #dock { bottom: 14px; gap: 2px; padding: 8px; }
      .dock-btn { padding: 9px 10px; font-size: 11px; }
    }
  </style>
  <script type="module" crossorigin src="../assets/egea-DyuPvlna.js"></script>
  <link rel="modulepreload" crossorigin href="../assets/VRButton-BD-ZbINE.js">
</head>
<body>
  <div id="app"></div>

  <div id="loader">
    <div class="wordmark">
      <span class="sun">SUN</span><span class="plex">PLEX</span>
      <div class="sub">VR Stüdyo</div>
    </div>
    <div id="loader-bar"><div id="loader-fill"></div></div>
    <div id="loader-status">Stüdyo hazırlanıyor</div>
  </div>

  <header id="topbar">
    <div class="wordmark">
      <span class="sun">SUN</span><span class="plex">PLEX</span>
    </div>
    <div class="model-tag">
      <strong>Fiat Egea</strong>
      Cam Rüzgarlığı · Sanal Stüdyo
    </div>
  </header>

  <div id="station-label">Yan Profil</div>
  <div id="hint">Sürükleyerek bakının · W A S D veya ok tuşları: aracın etrafında yürüyün · Boşluk: sonraki nokta</div>


</body>
</html>
